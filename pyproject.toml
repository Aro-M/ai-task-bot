[project]
name = "ai-task-bot"
version = "0.1.0"
description = "Private Telegram text and voice task workspace"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "sqlalchemy[asyncio]>=2.0,<2.1",
  "asyncpg>=0.30,<1",
  "aiosqlite>=0.21,<1",
  "alembic>=1.15,<2",
  "pydantic-settings>=2.8,<3",
  "PyJWT>=2.10,<3",
  "redis>=5.2,<6",
  "celery[redis]>=5.5,<6",
  "httpx>=0.28,<1",
  "aiogram>=3.20,<4",
]

[dependency-groups]
dev = [
  "pytest>=9.0.3,<10",
  "pytest-asyncio>=1,<2",
  "pytest-cov>=7,<8",
  "respx>=0.22,<1",
  "fakeredis>=2.27,<3",
  "ruff>=0.11,<1",
  "black>=25,<27",
  "mypy>=1.15,<2",
  "pip-audit>=2.9,<3",
  "bandit>=1.8,<2",
  "aioresponses>=0.7.9",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
markers = ["integration: requires isolated PostgreSQL and Redis", "e2e: complete service journey"]
addopts = "-ra"

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 80

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
disallow_untyped_defs = true
ignore_missing_imports = true
exclude = ["migrations/"]

[[tool.mypy.overrides]]
module = ["celery.*", "telegram.*"]
follow_untyped_imports = true
